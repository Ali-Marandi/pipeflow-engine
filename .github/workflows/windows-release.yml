name: Windows Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test

  windows:
    needs: quality
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:windows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ github.ref_name }}
      - name: Smoke test and benchmark packaged executable
        shell: pwsh
        run: ./scripts/benchmark-windows.ps1 -Version $env:RELEASE_VERSION -LaunchIterations 2
      - name: Upload Windows validation report
        uses: actions/upload-artifact@v4
        with:
          name: pipeflow-windows-validation-${{ github.ref_name }}
          path: dist/benchmarks/windows-executable-benchmark.json
          if-no-files-found: error
      - name: Publish release artifacts
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/*.blockmap
