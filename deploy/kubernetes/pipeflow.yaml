apiVersion: v1
kind: Namespace
metadata:
  name: pipeflow
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pipeflow-config
  namespace: pipeflow
data:
  PORT: "3000"
  REDIS_TELEMETRY_STREAM: "pipeflow:telemetry:v1"
  REALTIME_ALLOWED_ORIGINS: "https://pipeflow.example.com"
---
# Replace these placeholders through a sealed-secret, External Secrets controller, or CI secret injection.
apiVersion: v1
kind: Secret
metadata:
  name: pipeflow-secrets
  namespace: pipeflow
type: Opaque
stringData:
  DATABASE_URL: "mysql://USER:PASSWORD@MANAGED-MYSQL-HOST:3306/pipeflow"
  REDIS_URL: "rediss://:PASSWORD@MANAGED-REDIS-HOST:6380"
  REALTIME_SHARED_TOKEN: "REPLACE_WITH_A_LONG_RANDOM_SECRET"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pipeflow-gateway
  namespace: pipeflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: pipeflow-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pipeflow-gateway
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: ghcr.io/ali-marandi/pipeflow-engine:v1.1.3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: pipeflow-config
            - secretRef:
                name: pipeflow-secrets
          env:
            - name: PIPEFLOW_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
---
apiVersion: v1
kind: Service
metadata:
  name: pipeflow-gateway
  namespace: pipeflow
spec:
  selector:
    app.kubernetes.io/name: pipeflow-gateway
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pipeflow-gateway
  namespace: pipeflow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pipeflow-gateway
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pipeflow-gateway
  namespace: pipeflow
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["pipeflow.example.com"]
      secretName: pipeflow-tls
  rules:
    - host: pipeflow.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pipeflow-gateway
                port:
                  name: http
